apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: globomantics-app-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/smm42947-tech/Demo-01-Setting-up-Git-Repository-for-GitOps.git
    targetRevision: HEAD
    path: apps/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: globomantics-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
